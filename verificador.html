<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>Verificación Oficial de Nómina - HCEO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; max-width: 440px; width: 100%; overflow: hidden; box-shadow: 0 20px 35px rgba(0,0,0,0.5); }
        .header { background: #1b365d; padding: 18px 20px; text-align: center; border-bottom: 3px solid #10b981; }
        .header h1 { font-size: 15px; letter-spacing: 0.5px; color: #fff; }
        .header p { font-size: 11px; color: #cbd5e1; margin-top: 3px; }
        .badge-ok { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; padding: 10px; margin: 16px; border-radius: 10px; text-align: center; font-weight: 800; font-size: 13px; }
        .badge-err { background: rgba(244, 63, 94, 0.15); border: 1px solid #f43f5e; color: #fb7185; padding: 14px; margin: 16px; border-radius: 10px; text-align: center; font-weight: 800; font-size: 13px; }
        .debug-msg { margin-top: 8px; padding: 6px; background: rgba(0,0,0,0.3); border-radius: 6px; font-family: 'Consolas', monospace; font-size: 10px; color: #fde047; font-weight: normal; word-break: break-word; }
        .body-data { padding: 0 18px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
        .field { background: #0f172a; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; }
        .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 2px; }
        .val { font-size: 13px; font-weight: 700; color: #f1f5f9; word-break: break-word; }
        .mono { font-family: 'Consolas', monospace; color: #38bdf8; }
        .neto { background: #064e3b; border-color: #10b981; }
        .neto .val { font-size: 18px; color: #34d399; }
        .footer { text-align: center; font-size: 10px; color: #64748b; padding: 12px 16px; border-top: 1px solid #334155; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="card" id="contenedor">
        <div class="header">
            <h1>H. CONGRESO DEL ESTADO DE OAXACA</h1>
            <p>LXVI LEGISLATURA • DIRECCIÓN DE RECURSOS HUMANOS</p>
        </div>
        <div id="contenido"></div>
        <div class="footer">Verificación Asimétrica ECDSA P-256 • Sin almacenamiento ni consulta a servidor</div>
    </div>

    <script>
        (async function() {
            const cont = document.getElementById('contenido');

            // PEGA AQUÍ TU LLAVE PÚBLICA COMPLETA
            const LLAVE_PUBLICA_PEM = `-----BEGIN PUBLIC KEY-----
MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEb0c0ICmNlpJIflakvQ+0PP81+fN6
qKn4HLsDVFsvs0TBxlqF8EhpAlyDTIMwowP21LzU9o5QWR3gn2HjOCPs7w==
-----END PUBLIC KEY-----`;

            function base64UrlToUint8Array(b64Url) {
                let b64 = b64Url.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4 !== 0) b64 += '=';
                const binStr = atob(b64);
                return Uint8Array.from(binStr, c => c.charCodeAt(0));
            }

            function pemToArrayBuffer(pem) {
                const b64 = pem
                    .replace(/-----BEGIN PUBLIC KEY-----/g, '')
                    .replace(/-----END PUBLIC KEY-----/g, '')
                    .replace(/[^A-Za-z0-9+/=]/g, '');
                const binStr = atob(b64);
                const bytes = new Uint8Array(binStr.length);
                for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                return bytes.buffer;
            }

            try {
                const hash = window.location.hash.substring(1);
                if (!hash) throw new Error("Paso 1: El enlace no trae datos después del # (hash vacío).");

                let d;
                try {
                    const jsonBytes = base64UrlToUint8Array(hash);
                    const jsonStr = new TextDecoder().decode(jsonBytes);
                    d = JSON.parse(jsonStr);
                } catch (errJson) {
                    throw new Error("Paso 2: No se pudo decodificar el JSON del QR (" + errJson.message + ")");
                }

                if (!d.f || !d.n || !d.s || !d.r || !d.p || !d.l) {
                    throw new Error("Paso 3: Faltan campos obligatorios en el QR.");
                }

                let pubKey;
                try {
                    pubKey = await crypto.subtle.importKey(
                        "spki",
                        pemToArrayBuffer(LLAVE_PUBLICA_PEM),
                        { name: "ECDSA", namedCurve: "P-256" },
                        false,
                        ["verify"]
                    );
                } catch (errKey) {
                    throw new Error("Paso 4: Error en el formato de LLAVE_PUBLICA_PEM (" + errKey.message + ")");
                }

                const enc = new TextEncoder();
                const payloadFirmado = `${d.r}|${d.n}|${d.u || ''}|${d.p}|${d.tp}|${d.td}|${d.l}`;
                const firmaBytes = base64UrlToUint8Array(d.s);

                if (firmaBytes.length !== 64) {
                    throw new Error("Paso 5: El sello no es ECDSA de 64 bytes (mide " + firmaBytes.length + " bytes). Es probable que el QR sea de una versión anterior.");
                }

                const esValido = await crypto.subtle.verify(
                    { name: "ECDSA", hash: { name: "SHA-256" } },
                    pubKey,
                    firmaBytes,
                    enc.encode(payloadFirmado)
                );

                if (!esValido) {
                    throw new Error("Paso 6: La firma ECDSA no coincide con la Llave Pública configurada.");
                }

                // Limpiar URL solo si la verificación fue exitosa
                if (window.history && window.history.replaceState) {
                    window.history.replaceState(null, "", window.location.pathname);
                }

                cont.innerHTML = `
                    <div class="badge-ok">✅ COMPROBANTE AUTÉNTICO VERIFICADO</div>
                    <div class="body-data">
                        <div class="field"><span class="label">Folio Institucional</span><span class="val mono" id="v-folio"></span></div>
                        <div class="field"><span class="label">Trabajador / Receptor</span><span class="val" id="v-nombre"></span></div>
                        <div class="field"><span class="label">RFC / NUP</span><span class="val mono" id="v-rfc"></span></div>
                        <div class="field"><span class="label">Período de Pago</span><span class="val" id="v-periodo"></span></div>
                        <div class="field"><span class="label">Total Percepciones / Deducciones</span><span class="val mono" id="v-totales"></span></div>
                        <div class="field neto"><span class="label">Neto Pagado (MXN)</span><span class="val mono" id="v-neto"></span></div>
                        <div class="field"><span class="label">Firma Asimétrica ECDSA P-256</span><span class="val mono" style="font-size:10px;" id="v-sello"></span></div>
                    </div>
                `;

                document.getElementById('v-folio').textContent = d.f;
                document.getElementById('v-nombre').textContent = d.n;
                document.getElementById('v-rfc').textContent = `${d.r} • NUP: ${d.u || 'N/A'}`;
                document.getElementById('v-periodo').textContent = d.p;
                document.getElementById('v-totales').textContent = `+$${d.tp} / -$${d.td}`;
                document.getElementById('v-neto').textContent = `$${d.l}`;
                document.getElementById('v-sello').textContent = d.s.substring(0, 36) + "...";

            } catch (e) {
                cont.innerHTML = `
                    <div class="badge-err">
                        ❌ CÓDIGO INVÁLIDO O ALTERADO
                        <div class="debug-msg">${e.message}</div>
                    </div>`;
            }
        })();
    </script>
</body>
</html>
